# Values overrides layered on top of ../../helm/apitestrig's defaults for
# running the eSignet api-test (Go) harness inside the `esignet` namespace,
# alongside the eSignet deployment itself. Everything environment-specific
# (URLs, credentials, cron time, report storage) is filled in interactively
# by install.sh and passed via --set — this file only carries the bits that
# don't change per environment.

image:
  repository: mosipdev/apitest-esignet
  tag: develop-go
  pullPolicy: Always

apitestrig:
  # The image ships data/config/config.{mock,mosip,sunbird}.json baked in.
  # This deploy wrapper runs the harness against a real MOSIP-flavoured
  # eSignet, hence config.mosip.json. Switch to config.mock.json if you're
  # pointing this at a mock-plugin eSignet instead.
  configFile: /app/data/config/config.mosip.json

  # config.mosip.json's own run.surfaces defaults to
  # ["conformance", "api", "e2e"], and the conformance surface needs a
  # private plan config (conformance-suite-private/esignet-*.json) that
  # isn't shipped in the image or mounted by default (see
  # https://github.com/mosip/esignet/issues/2434 §5a/§6ii). Until that's
  # set up (apitestrig.conformancePlanConfig below, plus a reachable
  # CONFORMANCE_BASE_URL), default to api,e2e so a plain install doesn't
  # fail on a missing plan file. Set to "" to fall back to the config
  # file's own surfaces once conformance is wired up.
  surfaces: "api,e2e"

resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 512Mi
